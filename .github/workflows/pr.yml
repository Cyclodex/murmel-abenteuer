# Schnelle Tests für jeden PR: alle Playwright-Tests ausser den 16 Autopilot-Tests (npm run test:schnell)
# und pruefe-level.mjs für die Level, deren Datei oder Route der PR ändert (verteilt auf 8 Jobs, tests/verteile-level.mjs).
# Die volle Suite mit Autopilot durch alle Level läuft nachts (tests.yml).
name: Tests (PR)

on:
  pull_request:

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schnell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:schnell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Fahrten (geänderte Level × 16 Kombinationen) auf 8 Jobs verteilt, jeder fährt so viele gleichzeitig, wie er Kerne hat
  level-teil:
    name: level ${{ matrix.teil }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geänderte Level fahren
        run: |
          ids=$(node tests/geaenderte-level.mjs $(git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }}...HEAD))
          if [ -z "$ids" ]; then echo "Keine Level oder Routen geändert."; exit 0; fi
          fahrten=$(node tests/verteile-level.mjs ${{ matrix.teil }} 8 $ids)
          echo "Geänderte Level: $(echo $ids)"
          echo "Job ${{ matrix.teil }}/8: $(echo "$fahrten" | grep -c .) Fahrten"
          if [ -z "$fahrten" ]; then exit 0; fi
          echo "$fahrten" | xargs -P "$(nproc)" -L 1 sh -c 'node tests/pruefe-level.mjs "$0" --kombi "$1"'

  # Ein Check "level" für alle Teile (grün, wenn alle Teile grün sind)
  level:
    needs: level-teil
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.level-teil.result }}" = success
