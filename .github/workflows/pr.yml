# Schnelle Tests für jeden PR: alle Playwright-Tests ausser den 16 Autopilot-Tests (npm run test:schnell)
# und pruefe-level.mjs für die Level, deren Datei oder Route der PR ändert.
# Die volle Suite mit Autopilot durch alle Level läuft nachts (tests.yml).
name: Tests (PR)

on:
  pull_request:

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schnell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:schnell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  level:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geänderte Level fahren
        run: |
          ids=$(node tests/geaenderte-level.mjs $(git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }}...HEAD))
          if [ -z "$ids" ]; then echo "Keine Level oder Routen geändert."; exit 0; fi
          echo "Prüfe: $ids"
          echo "$ids" | xargs -P "$(nproc)" -n 1 node tests/pruefe-level.mjs
