# Schnelle Tests bei jedem PR: alles ausser den 16 Autopilot-Tests (npm run test:schnell).
# Die volle Suite läuft nachts (tests.yml).
name: Tests (schnell)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-schnell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:schnell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
