# Seite veröffentlichen (GitHub Pages): bei jedem Push auf main eine Kopie aller Dateien mit der Version (Commit) und
# einer Nummer (0.1, 0.2 …) stempeln (.github/stempel.mjs) und veröffentlichen. Das Spiel erkennt so ein Update und
# fragt auf der Karte, ob es neu laden soll (src/update.js), und der Browser mischt keine alten Dateien aus dem Cache mit neuen.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung, die neueste gewinnt
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ganze Geschichte, um die Updates zu zählen
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dateien kopieren und stempeln
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          # Nummer zum Anzeigen: 0.<Updates auf main seit 47990b0>, z. B. 0.3 (jeder Merge oder Push auf main zählt eins)
          nummer="0.$(git rev-list --count --first-parent 47990b0..HEAD)"
          node .github/stempel.mjs _site "${GITHUB_SHA::12}" "$(git log -1 --format=%cI)" "$nummer"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
