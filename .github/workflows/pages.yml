# Seite veröffentlichen (GitHub Pages): bei jedem Push auf main eine Kopie aller Dateien mit der Version (Commit)
# stempeln (.github/stempel.mjs) und veröffentlichen. Das Spiel erkennt so ein Update und lädt auf der Karte neu
# (src/update.js), und der Browser mischt keine alten Dateien aus dem Cache mit neuen.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung, die neueste gewinnt
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dateien kopieren und stempeln
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          node .github/stempel.mjs _site "${GITHUB_SHA::12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
