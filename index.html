<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Murmel-Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>window.addEventListener('error',function(e){var h=document.querySelector('#startOv h1');if(h&&!window.__errShown){window.__errShown=1;var p=document.createElement('div');p.className='pill';p.style.fontSize='16px';p.textContent='Fehler: '+(e.message||'unbekannt');h.after(p);}});</script>
<canvas id="c"></canvas>
<div class="hud hidden" id="hud">
  <div class="pill" id="stars">⭐ 0/5</div>
  <div class="btns">
    <button id="btnCal" class="hidden" aria-label="Neigung neu ausrichten">🎯</button>
    <button id="btnReset" aria-label="Nochmal von vorne">🔄</button>
    <button id="btnHome" aria-label="Zur Karte">🏠</button>
  </div>
</div>
<div id="joy" class="hidden" aria-hidden="true"><div id="knob"></div></div>
<div id="toast" class="hidden"></div>

<div class="overlay" id="startOv">
  <h1>🔵 Murmel-Abenteuer</h1>
  <div class="row">
    <button class="big" id="startTilt">📱<small>Kippen</small></button>
    <button class="big" id="startJoy">🕹️<small>Joystick</small></button>
  </div>
</div>
<div class="overlay hidden" id="mapOv">
  <div class="row">
    <div class="pill" id="mapStars">⭐ 0</div>
    <button id="btnAlbum" aria-label="Sticker-Album">📒</button>
    <button id="btnSkins" aria-label="Murmel aussuchen">🎨</button>
    <button id="btnPower" aria-label="Stärke der Steuerung">🐇</button>
    <button id="btnSound" aria-label="Ton">🔊</button>
  </div>
  <div id="worlds"></div>
</div>
<div class="overlay hidden" id="skinOv">
  <h1>🎨</h1>
  <div class="grid" id="skinGrid"></div>
  <div class="pill">💫</div>
  <div class="grid" id="trailGrid"></div>
  <button class="big" id="skinBack" aria-label="Fertig">✔️</button>
</div>
<div class="overlay hidden" id="albumOv">
  <h1 id="albumCount">📒</h1>
  <div class="tabs" id="albumTabs"></div>
  <div class="grid stickers" id="albumGrid"></div>
  <button class="big" id="albumBack" aria-label="Fertig">✔️</button>
</div>
<div class="overlay hidden" id="winOv">
  <h1>🏆 Geschafft!</h1>
  <div class="pill" id="winStars">⭐⭐⭐⭐⭐</div>
  <div class="pill hidden" id="winUnlock"></div>
  <div class="row">
    <button class="big" id="againBtn" aria-label="Nochmal">🔄</button>
    <button class="big" id="nextBtn" aria-label="Nächstes Level">▶️</button>
    <button class="big" id="mapBtn" aria-label="Zur Karte">🏠</button>
  </div>
</div>
<div class="hidden" id="cheerOv" aria-live="polite"><div class="rain"></div><div class="items"></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
