<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Murmel-Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>window.addEventListener('error',function(e){var h=document.querySelector('#startOv h1');if(h&&!window.__errShown){window.__errShown=1;var p=document.createElement('div');p.className='pill';p.style.fontSize='16px';p.textContent='Fehler: '+(e.message||'unbekannt');h.after(p);}});</script>
<canvas id="c"></canvas>
<div class="hud hidden" id="hud">
  <div class="hudL">
    <div class="pill" id="stars">⭐ 0/5</div>
    <div class="pill small" id="timer">⏱ 0.0</div>
    <div class="pill small" id="watchName"></div>
  </div>
  <div id="pilotInfo" class="hidden"></div>
  <div class="btns">
    <button id="btnControl" aria-label="Steuerung wechseln: Kippen oder Joystick">🕹️</button>
    <button id="btnCal" class="hidden" aria-label="Neigung neu ausrichten">🎯</button>
    <button id="btnReset" aria-label="Nochmal von vorne">🔄</button>
    <button id="btnHome" aria-label="Zur Karte">🏠</button>
  </div>
</div>
<div id="joy" class="hidden" aria-hidden="true"><div id="knob"></div></div>
<div id="toast" class="hidden"></div>
<button class="big hidden" id="treppeBack" aria-label="Zurück zur Karte">🏠</button>

<div class="overlay" id="startOv">
  <h1>🔵 Murmel-Abenteuer</h1>
  <div class="row">
    <button class="big" id="startTilt">📱<small>Kippen</small></button>
    <button class="big" id="startJoy">🕹️<small>Joystick</small></button>
  </div>
</div>
<div class="overlay hidden" id="playerOv">
  <h1>👤 Wer spielt?</h1>
  <div id="playerList"></div>
  <form id="playerForm" class="row">
    <input id="playerName" maxlength="16" placeholder="Name" autocomplete="off" enterkeyhint="done" aria-label="Neuer Spieler: Name">
    <button type="submit" aria-label="Spieler anlegen">➕</button>
  </form>
</div>
<div class="overlay hidden" id="mapOv">
  <button class="pill" id="btnPlayer" aria-label="Spieler wechseln">👤</button>
  <div class="row">
    <button class="pill" id="mapStars" aria-label="Rangliste">⭐ 0</button>
    <button class="mbtn" id="btnAlbum" title="Sticker-Album"><span>🏅</span><small>Sticker</small></button>
    <button class="mbtn" id="btnSkins" title="Murmel aussuchen"><span>🔮</span><small>Murmel</small></button>
    <button class="mbtn" id="mapControl" title="Steuerung wechseln: Kippen oder Joystick"><span>🕹️</span><small>Joystick</small></button>
    <button class="mbtn" id="btnPower" title="Tempo der Murmel"><span>🐇</span><small>Mittel</small></button>
    <button class="mbtn" id="btnSound" title="Ton und Musik"><span>🔊</span><small>Ton an</small></button>
    <button class="mbtn" id="btnTreppe" title="Alle Murmeln auf der Treppe"><span>🪜</span><small>Treppe</small></button>
  </div>
  <div id="worlds"></div>
</div>
<div class="overlay hidden" id="skinOv">
  <h1>🔮</h1>
  <div class="grid" id="skinGrid"></div>
  <div class="pill">💫</div>
  <div class="grid" id="trailGrid"></div>
  <button class="big" id="skinBack" aria-label="Fertig">✔️</button>
</div>
<div class="overlay hidden" id="albumOv">
  <h1 id="albumCount">🏅</h1>
  <div id="albumInfo" class="rank" aria-live="polite"></div>
  <div id="albumGrid"></div>
  <button class="big" id="albumBack" aria-label="Fertig">✔️</button>
</div>
<div class="overlay hidden" id="winOv">
  <h1>🏆 Geschafft!</h1>
  <div class="pill" id="winStars">⭐⭐⭐⭐⭐</div>
  <div class="pill" id="winTime"></div>
  <div class="pill" id="winScore"></div>
  <div class="pill hidden" id="winUnlock"></div>
  <button class="rank hidden" id="winRank" aria-label="Rangliste von diesem Level"></button>
  <button class="pill hidden" id="winGhost" aria-label="Gegen die Aufnahme des Besten fahren"></button>
  <div class="row">
    <button class="big" id="againBtn" aria-label="Nochmal">🔄</button>
    <button class="big" id="nextBtn" aria-label="Nächstes Level">▶️</button>
    <button class="big" id="mapBtn" aria-label="Zur Karte">🏠</button>
  </div>
</div>
<div class="overlay hidden" id="ghostOv">
  <h1 id="ghostTitle"></h1>
  <div id="ghostPick"></div>
  <button class="big" id="ghostBack" aria-label="Zur Karte">🏠</button>
</div>
<div class="overlay hidden" id="rankOv">
  <div class="row">
    <button id="rankPrev" aria-label="Vorherige Rangliste">◀️</button>
    <h1 id="rankTitle">🌍</h1>
    <button id="rankNext" aria-label="Nächste Rangliste">▶️</button>
  </div>
  <div id="rankList"></div>
  <div class="pill hidden" id="rankEmpty">🤷</div>
  <button class="big" id="rankBack" aria-label="Fertig">✔️</button>
</div>
<div class="hidden" id="cheerOv" aria-live="polite"><div class="rain"></div><div class="items"></div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
