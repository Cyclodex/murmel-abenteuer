<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Murmel-Abenteuer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>window.addEventListener('error',function(e){var h=document.querySelector('#startOv h1');if(h&&!window.__errShown){window.__errShown=1;var p=document.createElement('div');p.className='pill';p.style.fontSize='16px';p.textContent='Fehler: '+(e.message||'unbekannt');h.after(p);}});</script>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill" id="stars">⭐ 0/5</div>
  <div class="btns">
    <button id="btnCal" class="hidden" aria-label="Neigung neu ausrichten">🎯</button>
    <button id="btnReset" aria-label="Nochmal von vorne">🔄</button>
  </div>
</div>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<div id="toast" class="hidden"></div>

<div class="overlay" id="startOv">
  <h1>🔵 Murmel-Abenteuer</h1>
  <div class="row">
    <button class="big" id="startTilt">📱<small>Kippen</small></button>
    <button class="big" id="startJoy">🕹️<small>Joystick</small></button>
  </div>
</div>
<div class="overlay hidden" id="winOv">
  <h1>🏆 Geschafft!</h1>
  <div class="pill" id="winStars">⭐⭐⭐⭐⭐</div>
  <button class="big" id="againBtn">🔄<small>Nochmal</small></button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/cannon.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
